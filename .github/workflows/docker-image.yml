name: Docker Image CI
on:
  push:
    branches:
      - "fraud-detection"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
            
    - name: Build main images
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: seng660team1/dollardollar:demo

    - name: Check for Image
      run: docker image ls

    - name: Save Docker image
      run: docker save -o seng660team1-docker-image.tar seng660team1/dollardollar:demo

    - name: Archive Docker image
      uses: actions/upload-artifact@v4
      with:
        name: seng660team1-docker-image
        path: ./seng660team1-docker-image.tar
        retention-days: 7