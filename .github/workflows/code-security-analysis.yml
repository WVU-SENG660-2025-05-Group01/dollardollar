name: Code Security Analysis

on:
  push:
    branches: [ fraud-detection ]
  pull_request:
    branches: [ fraud-detection ]

jobs:
  sast_codeql:
    name: SAST - CodeQL         #static code analysis engine developed by GitHub
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   #tells the workflow to check out your repository’s code into the GitHub Actions runner

      - name: Set up CodeQL
        uses: github/codeql-action/init@v3   #refers to a GitHub Action that initializes the CodeQL analysis process
        with:
          languages: 'python, javascript'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3   #refers to a GitHub Action that performs the CodeQL analysis
        with:
          category: 'security'   #specifies that the analysis should focus on security issues

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-results@v4   #refers to a GitHub Action that uploads the results of the CodeQL analysis
        with:
          - name: CodeQL Python Results
            path: ${{ runner.temp }}/results/python.sarif   #specifies the path to the SARIF file containing the analysis results
            retention-days: 7

          - name: CodeQL JavaScript Results
            path: ${{ runner.temp }}/results/javascript.sarif   #specifies the path to the SARIF file containing the analysis results
            retention-days: 7

